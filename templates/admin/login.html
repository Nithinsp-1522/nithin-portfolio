<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurinji Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#101827}.login-card{width:min(420px,92vw);background:#fff;border-radius:22px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.3)}.brand{font-weight:900;letter-spacing:.08em}</style></head><body><div class="login-card"><div class="brand fs-3 mb-1">KURINJI</div><div class="text-secondary mb-4">Admin Panel</div>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div><div class="mb-4"><label class="form-label">Password</label>{{ form.password }}</div><button class="btn btn-dark w-100 py-2">Sign in</button></form><a class="d-block text-center mt-3 text-decoration-none" href="/">Back to website</a></div></body></html>
